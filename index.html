<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>抽選販売 整理番号</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <h1 id="ev-name">読み込み中…</h1>
  <div class="sub" id="ev-desc"></div>

  <!-- ===== イベント概要 ===== -->
  <div class="card hide" id="ev-card">
    <div class="stats" id="ev-stats"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <table>
      <tbody>
        <tr><th>応募受付</th><td id="ev-entry"></td></tr>
        <tr><th>第1回抽選</th><td id="ev-draw"></td></tr>
        <tr><th>使用期限</th><td id="ev-claim"></td></tr>
        <tr><th>再抽選</th><td id="ev-rounds"></td></tr>
      </tbody>
    </table>
    <div class="sub" style="margin:10px 0 0">
      記載の日時はすべて日本時間（JST）です。<br>
      イベント番号: <span id="ev-no" style="font-family:ui-monospace,Menlo,monospace"></span>
    </div>
    <div class="msg warn" id="ev-phase"></div>
  </div>

  <!-- ===== 整理番号の発行 ===== -->
  <div class="card hide" id="entry-card">
    <h2>整理番号を受け取る</h2>

    <!-- 来店者限定イベントで、QR を読まずに来た人に出す案内 -->
    <div class="msg bad hide" id="gate-msg"></div>

    <div id="entry-body">
      <div class="msg ok hide" id="pass-banner"></div>
      <p class="sub" style="margin:0 0 8px">
        メールアドレス1つにつき整理番号は1つです。同じアドレスで送り直しても番号は変わりません。
      </p>
      <form id="entry-form">
        <label for="entry-email">メールアドレス</label>
        <div class="row">
          <input type="email" id="entry-email" required autocomplete="email" placeholder="you@example.com">
          <button type="submit" id="entry-btn">整理番号を発行</button>
        </div>
      </form>
      <div class="msg" id="entry-msg"></div>
      <div class="ticket hide" id="entry-ticket">
        <div class="cap">あなたの整理番号</div>
        <div class="no" id="entry-no"></div>
        <div class="cap" id="entry-note"></div>
      </div>
    </div>
  </div>

  <!-- ===== 当落照会 ===== -->
  <div class="card" id="lookup-card">
    <h2>当落を確認する</h2>
    <form id="lookup-form">
      <div class="grid2">
        <div>
          <label for="lk-no">整理番号</label>
          <input type="text" id="lk-no" required placeholder="A-0001" autocomplete="off">
        </div>
        <div>
          <label for="lk-email">メールアドレス</label>
          <input type="email" id="lk-email" required autocomplete="email" placeholder="you@example.com">
        </div>
      </div>
      <div style="margin-top:12px"><button type="submit" id="lk-btn">照会する</button></div>
    </form>
    <div class="msg" id="lk-msg"></div>
    <div class="hide" id="lk-result">
      <div class="ticket">
        <div class="cap">整理番号</div>
        <div class="no" id="lk-no-out"></div>
        <div style="margin-top:10px"><span class="badge" id="lk-badge"></span></div>
        <div class="cap" id="lk-detail" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <!-- ===== 注意事項・問い合わせ ===== -->
  <div class="card hide" id="terms-card">
    <h2>ご注意</h2>
    <ul class="sub" id="terms-list" style="margin:0;padding-left:1.2em;line-height:1.9"></ul>
    <p class="sub" id="terms-privacy" style="margin:14px 0 0"></p>
    <p class="sub" id="terms-contact" style="margin:6px 0 0"></p>
  </div>

  <!-- ===== 抽選履歴 ===== -->
  <div class="card hide" id="draws-card">
    <h2>抽選の記録</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>回</th><th>実行時刻</th><th>母数</th><th>当選</th><th>使用期限</th></tr></thead>
        <tbody id="draws-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var CFG  = window.APP_CONFIG;
  var QS   = new URLSearchParams(location.search);

  // イベント番号の表記ゆれ（小文字・ハイフン無し）を吸収して
  // 000001-000001-4F2A の形に揃える。保存キーも揃うようにするため。
  function normEvNo(s) {
    var h = String(s || '').replace(/[^0-9A-Fa-f]/g, '');
    return h.length === 16
      ? (h.slice(0, 6) + '-' + h.slice(6, 12) + '-' + h.slice(12, 16)).toUpperCase()
      : String(s || '');
  }

  var EVNO = normEvNo(QS.get('e') || CFG.DEFAULT_EVENT_NO);
  var CODE = QS.get('k');                    // 店内掲示 QR に埋めた秘密コード
  var sb   = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

  var $ = function (id) { return document.getElementById(id); };

  var PASS_KEY = 'chusen:pass:' + EVNO;      // 入店パスの置き場
  var PASS = null;                           // { pass_id, expires_at }
  var DONE = false;                          // この画面で整理番号を受け取り済みか

  var STATUS_JA = {
    entered:  '抽選待ち',
    won:      '当選',
    redeemed: '利用済み',
    expired:  '落選（期限切れ）',
    void:     '無効'
  };

  var ERROR_JA = {
    event_not_found:  'イベントが見つかりません。URL をご確認ください。',
    event_not_open:   'このイベントは現在受付を行っていません。',
    entry_not_started:'応募の受付はまだ始まっていません。',
    entry_closed:     '応募の受付は終了しました。',
    invalid_email:    'メールアドレスの形式が正しくありません。',
    not_found:        '該当する整理番号が見つかりません。番号とメールアドレスをご確認ください。',
    invalid_code:     'この QR コードはこのイベントでは使用できません。',
    code_disabled:    'この QR コードは現在無効です。店頭のスタッフにお尋ねください。',
    code_exhausted:   'この QR コードからの受付は上限に達しました。',
    pass_required:    '店内の QR コードを読み取ってから応募してください。',
    pass_invalid:     '読み取り情報が確認できませんでした。QR コードをもう一度読み取ってください。',
    pass_used:        'この読み取りは既に使用済みです。QR コードをもう一度読み取ってください。',
    pass_expired:     '読み取りから時間が経ちすぎました。QR コードをもう一度読み取ってください。'
  };

  // --- 表示ヘルパ -----------------------------------------------------
  function fmt(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function dur(minutes) {
    if (minutes % 1440 === 0) return (minutes / 1440) + '日間';
    if (minutes % 60 === 0)   return (minutes / 60) + '時間';
    return minutes + '分間';
  }

  function say(el, text, kind) {
    el.textContent = text || '';
    el.className = 'msg' + (text ? ' ' + (kind || 'warn') : '');
  }

  function errText(res) {
    if (!res) return '通信に失敗しました。時間をおいてお試しください。';
    return ERROR_JA[res.error] || ('エラー: ' + res.error);
  }

  // --- RPC ラッパ -----------------------------------------------------
  function rpc(name, args) {
    return sb.rpc(name, args).then(function (r) {
      if (r.error) { console.error(name, r.error); return null; }
      return r.data;
    });
  }

  // --- イベント情報 ---------------------------------------------------
  var EV = null;

  function loadEvent() {
    return rpc('event_public', { p_event_no: EVNO }).then(function (d) {
      if (!d || !d.ok) {
        $('ev-name').textContent = 'イベントが見つかりません';
        $('ev-desc').textContent = '指定されたイベント (' + EVNO + ') は公開されていません。';
        return;
      }
      EV = d;
      $('ev-name').textContent = d.name;
      $('ev-desc').textContent = d.description || '';
      $('ev-card').classList.remove('hide');

      $('ev-stats').innerHTML =
        '<div><b>' + d.winners_count + '</b>当選枠</div>' +
        '<div><b>' + d.entry_count + '</b>応募数</div>' +
        '<div><b>' + d.redeemed_count + '</b>利用済み</div>' +
        '<div><b>' + d.active_winner_count + '</b>当選中</div>';

      $('ev-no').textContent     = d.event_no || '—';
      $('ev-entry').textContent  = fmt(d.entry_open_at) + ' 〜 ' + fmt(d.entry_close_at);
      $('ev-draw').textContent   = fmt(d.first_draw_at);
      $('ev-claim').textContent  = '当選から ' + dur(d.claim_window_minutes) + '以内';
      $('ev-rounds').textContent = '最大 ' + d.max_rounds + ' 回（実施済み ' + d.rounds_done + ' 回）'
        + ' / 期限までに利用されなかった枠は次点の方へ再抽選します';

      renderTerms(d);
      showPhase(d);
    });
  }

  // 掲示物と同じ条件をページにも出す。
  // 紙を読まずに QR だけ読んだ人にも伝わるようにするため。
  function renderTerms(d) {
    var items = [
      '当選のご連絡はいたしません。このページの「当落を確認する」から各自ご確認ください。',
      '確認には整理番号とメールアドレスの両方が必要です。整理番号は必ず控えてください。',
      '当選された方は、当選から ' + dur(d.claim_window_minutes) + '以内にお手続きください。',
      '期限を過ぎた当選は無効となり、空いた枠は落選された方の中から改めて抽選します' +
        '（抽選は最大 ' + d.max_rounds + ' 回）。',
      'メールアドレス1つにつき整理番号は1つです。'
    ];
    if (d.require_entry_code) {
      items.unshift('本抽選は、店頭に掲示された QR コードからのみご応募いただけます。');
    }
    (d.notice || '').split('\n').forEach(function (line) {
      if (line.trim()) items.push(line.trim());
    });

    $('terms-list').innerHTML = items.map(function (s) {
      var li = document.createElement('li');
      li.textContent = s;
      return li.outerHTML;
    }).join('');

    $('terms-privacy').textContent = d.privacy_note
      ? '【個人情報の取り扱い】' + d.privacy_note : '';
    $('terms-contact').textContent = d.contact_info
      ? '【お問い合わせ】' + (d.organizer ? d.organizer + '　' : '') + d.contact_info : '';
    $('terms-card').classList.remove('hide');
  }

  function showPhase(d) {
    var now = new Date(d.now).getTime();
    var open = new Date(d.entry_open_at).getTime();
    var close = new Date(d.entry_close_at).getTime();
    var canEnter = d.status === 'open' && now >= open && now <= close;

    if (canEnter) {
      $('entry-card').classList.remove('hide');
      say($('ev-phase'), '', null);
      applyGate(d);
      return;
    }
    if (d.status === 'finished') {
      say($('ev-phase'), 'このイベントの抽選はすべて終了しました。', 'warn');
    } else if (d.status === 'cancelled') {
      say($('ev-phase'), 'このイベントは中止されました。', 'bad');
    } else if (now < open) {
      say($('ev-phase'), '応募受付の開始は ' + fmt(d.entry_open_at) + ' です。', 'warn');
    } else {
      say($('ev-phase'), '応募受付は終了しました。当落は下の照会からご確認ください。', 'warn');
    }
  }

  // --- 入店パス（来店者限定イベント用）--------------------------------
  //
  // 店内に掲示した QR には ?e=<イベント番号>&k=<秘密コード> が入っている。
  // 読み取ると claim_store_pass で1回限りのパスを受け取り、
  // 30分以内にメールを入れて整理番号を取る、という流れ。
  //
  // パスは sessionStorage に置く。タブを閉じれば消える性質が
  // 「店を出てから家族に転送する」を少しだけ面倒にする。

  function loadPass() {
    try {
      var p = JSON.parse(sessionStorage.getItem(PASS_KEY) || 'null');
      if (p && new Date(p.expires_at).getTime() > Date.now()) return p;
    } catch (err) { /* 読めなければパス無しとして扱う */ }
    return null;
  }

  function savePass(p) {
    PASS = p;
    try { sessionStorage.setItem(PASS_KEY, JSON.stringify(p)); }
    catch (err) { /* 保存できなくてもこのページ内では動く */ }
  }

  function clearPass() {
    PASS = null;
    try { sessionStorage.removeItem(PASS_KEY); } catch (err) { /* 無視 */ }
  }

  // URL から k を消す。アドレスバーのスクリーンショットや
  // 「共有」からコードが漏れるのを少しでも減らすため。
  function stripCodeFromUrl() {
    if (!CODE) return;
    var q = new URLSearchParams(location.search);
    q.delete('k');
    var url = location.pathname + (q.toString() ? '?' + q.toString() : '');
    try { history.replaceState(null, '', url); } catch (err) { /* 無視 */ }
  }

  function applyGate(d) {
    // 受け取り済みなら、発行された番号を出したまま静かにしておく
    if (DONE) {
      $('gate-msg').classList.add('hide');
      $('entry-body').classList.remove('hide');
      return;
    }

    if (!d.require_entry_code) {
      $('gate-msg').classList.add('hide');
      $('entry-body').classList.remove('hide');
      return;
    }

    PASS = PASS || loadPass();

    if (PASS) {
      $('gate-msg').classList.add('hide');
      $('entry-body').classList.remove('hide');
      startPassCountdown();
      return;
    }

    if (CODE) {
      // QR から来たので、これからパスを取る
      $('entry-body').classList.add('hide');
      $('gate-msg').classList.remove('hide');
      $('gate-msg').className = 'msg warn';
      $('gate-msg').textContent = '読み取りを確認しています…';
      rpc('claim_store_pass', { p_event_no: EVNO, p_code: CODE }).then(function (r) {
        stripCodeFromUrl();
        if (!r || !r.ok) {
          $('gate-msg').className = 'msg bad';
          $('gate-msg').textContent = errText(r);
          return;
        }
        savePass({ pass_id: r.pass_id, expires_at: r.expires_at });
        $('gate-msg').classList.add('hide');
        $('entry-body').classList.remove('hide');
        startPassCountdown();
      });
      return;
    }

    // QR を読まずに直接来た人
    $('entry-body').classList.add('hide');
    $('gate-msg').classList.remove('hide');
    $('gate-msg').className = 'msg bad';
    $('gate-msg').textContent =
      'このイベントは店頭にご来店いただいた方限定です。' +
      '店内に掲示している QR コードを読み取ってから、このページを開いてください。';
  }

  var passTimer = null;

  function startPassCountdown() {
    if (passTimer) clearInterval(passTimer);
    var tick = function () {
      if (!PASS) return;
      var left = Math.floor((new Date(PASS.expires_at).getTime() - Date.now()) / 1000);
      if (left <= 0) {
        clearInterval(passTimer);
        clearPass();
        $('entry-body').classList.add('hide');
        $('gate-msg').classList.remove('hide');
        $('gate-msg').className = 'msg bad';
        $('gate-msg').textContent =
          '読み取りから時間が経過したため、受付を終了しました。' +
          '店内の QR コードをもう一度読み取ってください。';
        return;
      }
      var m = Math.floor(left / 60), s = left % 60;
      $('pass-banner').classList.remove('hide');
      $('pass-banner').className = 'msg ' + (left < 300 ? 'warn' : 'ok');
      $('pass-banner').textContent =
        'ご来店の確認ができました。残り ' + m + '分' + String(s).padStart(2, '0') + '秒 以内に応募を完了してください。';
    };
    tick();
    passTimer = setInterval(tick, 1000);
  }

  // --- 抽選履歴 -------------------------------------------------------
  function loadDraws() {
    // 正規化済みのイベント番号は event_public の戻り値にある
    if (!EV || !EV.event_no) return;
    sb.from('events').select('id').eq('event_no', EV.event_no).maybeSingle().then(function (r) {
      if (r.error || !r.data) return;
      return sb.from('draws').select('*').eq('event_id', r.data.id)
               .order('round_no', { ascending: true });
    }).then(function (r) {
      if (!r || r.error || !r.data || !r.data.length) return;
      $('draws-card').classList.remove('hide');
      $('draws-body').innerHTML = r.data.map(function (d) {
        return '<tr><td class="no">第' + d.round_no + '回</td>' +
               '<td>' + fmt(d.executed_at) + '</td>' +
               '<td class="no">' + d.candidates + '</td>' +
               '<td class="no">' + d.picked + ' / ' + d.slots + '</td>' +
               '<td>' + fmt(d.expires_at) + '</td></tr>';
      }).join('');
    });
  }

  // --- 整理番号の発行 -------------------------------------------------
  $('entry-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('entry-email').value.trim();
    var btn = $('entry-btn');
    btn.disabled = true;
    say($('entry-msg'), '', null);

    rpc('issue_ticket', {
      p_event_no: EVNO, p_email: email,
      p_pass_id: PASS ? PASS.pass_id : null
    }).then(function (d) {
      btn.disabled = false;
      if (!d || !d.ok) {
        say($('entry-msg'), errText(d), 'bad');
        // パス側の失敗なら、もう一度読み取ってもらうしかない
        if (d && /^pass_/.test(d.error || '')) { clearPass(); loadEvent(); }
        return;
      }

      // パスは1回限り。使い終わったので捨てる。
      DONE = true;
      if (passTimer) clearInterval(passTimer);
      clearPass();
      $('pass-banner').classList.add('hide');
      $('entry-email').disabled = true;
      $('entry-btn').disabled = true;

      $('entry-ticket').classList.remove('hide');
      $('entry-no').textContent = d.ticket_no;
      $('entry-note').textContent = d.already
        ? 'このメールアドレスでは既に発行済みです。'
        : '発行しました。番号は控えておいてください。';
      say($('entry-msg'),
          '抽選結果は下の「当落を確認する」から、この番号とメールアドレスでご確認ください。', 'ok');

      try { localStorage.setItem('chusen:' + EVNO, JSON.stringify({ no: d.ticket_no, email: email })); }
      catch (err) { /* プライベートモード等では保存できない。動作には支障なし */ }

      $('lk-no').value = d.ticket_no;
      $('lk-email').value = email;
      loadEvent();
    });
  });

  // --- 当落照会 -------------------------------------------------------
  $('lookup-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('lk-btn');
    btn.disabled = true;
    say($('lk-msg'), '', null);

    rpc('lookup_ticket', {
      p_event_no: EVNO,
      p_ticket_no: $('lk-no').value.trim(),
      p_email: $('lk-email').value.trim()
    }).then(function (d) {
      btn.disabled = false;
      if (!d || !d.ok) {
        $('lk-result').classList.add('hide');
        say($('lk-msg'), errText(d), 'bad');
        return;
      }
      renderLookup(d);
    });
  });

  function renderLookup(d) {
    $('lk-result').classList.remove('hide');
    $('lk-no-out').textContent = d.ticket_no;
    $('lk-badge').textContent = STATUS_JA[d.status] || d.status;
    $('lk-badge').className = 'badge ' + d.status;

    var detail = '', kind = 'warn', note = '';

    if (d.status === 'entered') {
      if (d.rounds_done === 0) {
        detail = '第1回抽選は ' + fmt(d.first_draw_at) + ' に行われます。';
      } else if (d.event_status === 'finished') {
        detail = '抽選はすべて終了しました。今回はご縁がありませんでした。';
      } else {
        detail = '第' + d.rounds_done + '回まで終了。次点の抽選対象として残っています。';
      }
      note = detail;
    } else if (d.status === 'won') {
      detail = '第' + d.round_won + '回抽選で当選しました。';
      note = fmt(d.expires_at) + ' までにご利用ください。期限を過ぎると失効し、次点の方へ回ります。';
      kind = 'ok';
    } else if (d.status === 'redeemed') {
      detail = 'お手続きは完了しています（' + fmt(d.redeemed_at) + '）。';
      note = detail;
      kind = 'ok';
    } else if (d.status === 'expired') {
      detail = '第' + d.round_won + '回で当選しましたが、' + fmt(d.expires_at) + ' の期限までにご利用がなかったため失効しました。';
      note = detail;
      kind = 'bad';
    } else if (d.status === 'void') {
      note = 'この整理番号は無効化されています。';
      kind = 'bad';
    }

    $('lk-detail').textContent = detail;
    say($('lk-msg'), note, kind);
  }

  // --- 起動 -----------------------------------------------------------
  try {
    var saved = JSON.parse(localStorage.getItem('chusen:' + EVNO) || 'null');
    if (saved) { $('lk-no').value = saved.no; $('lk-email').value = saved.email; }
  } catch (err) { /* 読めなくても構わない */ }

  // 抽選履歴はイベント情報が取れてから引く（正規化済みの番号が要る）
  loadEvent().then(loadDraws);

  // 開催中は1分ごとに概要を更新して、抽選の進行が画面に出るようにする
  setInterval(function () {
    if (EV && (EV.status === 'open')) { loadEvent().then(loadDraws); }
  }, 60000);
})();
</script>
</body>
</html>
